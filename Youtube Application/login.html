<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
      <link rel="stylesheet" href="./css/style.css">

</head>
<body>
    <div class="login-box text-center">
    <img src="https://www.logo.wine/a/logo/YouTube/YouTube-Logo.wine.svg" alt="YouTube Logo" class="youtube-logo">

    <h5 class="mb-3">Sign in</h5>
    <p class="text-muted">to continue to YouTube</p>

    <form>
      <div class="mb-3 text-start">   
        <label for="email" class="form-label">Email or phone</label>
        <input type="email" class="form-control" id="email" placeholder="Enter email or phone">
      </div>

      <div class="mb-3 text-start">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" placeholder="Enter password">
      </div>

      <div class="d-grid mb-3">
        <button type="submit" class="btn btn-signin">Sign In</button>
      </div>

      <div class="text-start">
        <a href="#" class="text-decoration-none">Forgot password?</a>
      </div>
    </form>

    <hr>

    <p class="text-muted small">Don't have an account?</p>
    <a href="#" class="btn btn-outline-secondary btn-sm">Create account</a>
  </div>
</body>
</html>
