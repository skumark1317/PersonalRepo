<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact</title>
  <link rel="stylesheet" href="contact.css">
</head>
<body>

  <!-- Banner Image -->
  <img src="./Imeges/banner.png" alt="Contact Banner" class="banner">

  <h2>Contact Us</h2>
  <form>
    <label for="name">Name:</label><br>
    <input type="text" id="name" name="name" required><br>

    <label for="email">Email:</label><br>
    <input type="email" id="email" name="email" required><br>

    <label for="message">Message:</label><br>
    <textarea id="message" name="message" rows="4" required></textarea><br>

    <button type="submit">Send</button><br><br>
    <a href="index.html">⬅ Back to Home</a>
  </form>

  <!-- Google Map Location -->
  <div class="map">
    <iframe 
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3890.560745882937!2d77.5946!3d12.9716!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bae1670c768ddd3%3A0x5aa6e8f564fa3a9a!2sBangalore%2C%20India!5e0!3m2!1sen!2sin!4v1717999999999" 
      width="100%" 
      height="300" 
      style="border:0;" 
      allowfullscreen="" 
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade">
    </iframe>
  </div>
  

</body>
</html>
